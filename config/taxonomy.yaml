version: taxonomy-v0.2
features:
  factual_manipulation: External trustworthy verification required.
  selective_presentation: Comparison coverage and counterevidence required.
  emotional_manipulation: Author-attributable emotional pressure beyond the evidence.
  logical_manipulation: Author-attributable misleading argument structure.
  authority_manipulation: Misleading appeal only; fabrication remains unassessed without verification.
  repetition_amplification: Repeated canonical claims within this material only.
  strategic_persuasion: Manipulative document-level persuasion, not ordinary advocacy.
techniques:
  loaded_language: emotional_manipulation
  appeal_to_fear: emotional_manipulation
  false_dilemma: logical_manipulation
  scapegoating: strategic_persuasion
  ad_hominem: logical_manipulation
  appeal_to_authority: authority_manipulation
  bandwagon: authority_manipulation
  repetition: repetition_amplification
  thought_terminating_cliche: logical_manipulation
  coercive_identity: strategic_persuasion
  misleading_statistics: factual_manipulation
  unsupported_factual_assertion: factual_manipulation
  cherry_picking: selective_presentation
