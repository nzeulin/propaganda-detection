version: experimental-weighted-v1
minimum_coverage: 0.80
required_features: [emotional_manipulation, logical_manipulation, strategic_persuasion]
indicator_threshold: 0.50
strong_threshold: 0.75
highlight_yellow: 0.50
highlight_red: 0.75
top_three_diagnostic: false
scoring_batch_questions: 32
weighted_scoring:
  review_threshold: 0.35
  propaganda_threshold: 0.50
  weights:
    logical_manipulation: 0.30
    strategic_persuasion: 0.30
    emotional_manipulation: 0.20
    authority_manipulation: 0.15
    repetition_amplification: 0.05
